<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pixora PDF — Imagens para PDF</title>
<meta name="description" content="Transforme suas imagens em um único PDF, direto no navegador. Rápido, gratuito e privado.">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6858529705565321" crossorigin="anonymous"></script>
<style>
  :root{
    --primary:#6366f1;
    --primary-dark:#4338ca;
    --primary-darker:#3730a3;
    --primary-light:#eef2ff;
    --bg:#f6f6fb;
    --card:#ffffff;
    --text:#1f2333;
    --muted:#6b7280;
    --border:#e6e6f0;
    --success:#16a34a;
    --danger:#e11d48;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow:0 10px 30px rgba(67,56,202,0.10);
    --shadow-sm:0 2px 8px rgba(31,35,51,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, rgba(99,102,241,0.10), transparent 60%),
      radial-gradient(1000px 500px at 110% 10%, rgba(99,102,241,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }
  a{color:inherit;}
  .container{
    width:100%;
    max-width:880px;
    margin:0 auto;
    padding:0 20px;
  }
  header.top{
    padding:22px 0 8px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .logo{
    width:42px;height:42px;border-radius:12px;
    background:linear-gradient(135deg,var(--primary),var(--primary-darker));
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:20px;
    box-shadow:var(--shadow-sm);
    flex-shrink:0;
  }
  .brand-name{font-weight:800;font-size:19px;letter-spacing:-0.02em;}
  .brand-name span{color:var(--primary);}

  main{flex:1;padding:28px 0 60px;}

  .hero{
    text-align:center;
    padding:22px 0 6px;
  }
  .hero h1{
    font-size:clamp(24px,4.4vw,38px);
    line-height:1.15;
    margin:0 0 12px;
    letter-spacing:-0.02em;
  }
  .hero p{
    color:var(--muted);
    font-size:16px;
    max-width:560px;
    margin:0 auto 26px;
    line-height:1.55;
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:28px;
  }

  .dropzone{
    border:2px dashed #c7c9f5;
    border-radius:var(--radius-md);
    background:linear-gradient(180deg, var(--primary-light), #fff);
    padding:38px 20px;
    text-align:center;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
    cursor:pointer;
  }
  .dropzone.drag-over{
    border-color:var(--primary);
    background:#e9e9ff;
    transform:scale(1.005);
  }
  .dropzone .icon{
    width:56px;height:56px;margin:0 auto 14px;
    border-radius:50%;
    background:var(--primary-light);
    display:flex;align-items:center;justify-content:center;
  }
  .dropzone .icon svg{width:26px;height:26px;color:var(--primary);}
  .dropzone .drop-text{
    color:var(--muted);
    font-size:14px;
    margin:6px 0 18px;
  }

  .btn{
    border:none;
    cursor:pointer;
    font-weight:700;
    font-size:15px;
    border-radius:12px;
    padding:13px 22px;
    transition:transform .08s ease, box-shadow .15s ease, opacity .15s ease, background .15s ease;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .btn:active{transform:translateY(1px);}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none;}
  .btn-primary{
    background:linear-gradient(135deg,var(--primary),var(--primary-dark));
    color:#fff;
    box-shadow:0 6px 18px rgba(99,102,241,0.35);
  }
  .btn-primary:hover:not(:disabled){box-shadow:0 8px 22px rgba(99,102,241,0.45);}
  .btn-secondary{
    background:var(--primary-light);
    color:var(--primary-dark);
  }
  .btn-secondary:hover:not(:disabled){background:#e3e4fc;}
  .btn-ghost{
    background:transparent;
    color:var(--muted);
    border:1px solid var(--border);
  }
  .btn-ghost:hover:not(:disabled){background:#f4f4fa;}
  .btn-block{width:100%;}
  .btn-lg{padding:15px 26px;font-size:16px;}

  input[type="file"]{display:none;}

  .list-section{margin-top:26px;}
  .list-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:14px;
  }
  .list-header h2{
    font-size:16px;
    margin:0;
    font-weight:700;
  }
  .list-actions{display:flex;gap:10px;flex-wrap:wrap;}

  .image-list{
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:520px;
    overflow-y:auto;
    padding-right:2px;
    margin-bottom:20px;
  }
  .image-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:var(--radius-sm);
    padding:10px;
    box-shadow:var(--shadow-sm);
  }
  .image-item .num{
    width:26px;height:26px;flex-shrink:0;
    border-radius:50%;
    background:var(--primary-light);
    color:var(--primary-dark);
    font-size:12px;font-weight:800;
    display:flex;align-items:center;justify-content:center;
  }
  .image-item .thumb{
    width:52px;height:52px;flex-shrink:0;
    border-radius:8px;
    object-fit:cover;
    background:#f1f1f7;
    border:1px solid var(--border);
  }
  .image-item .meta{
    flex:1;
    min-width:0;
  }
  .image-item .fname{
    font-size:13.5px;
    font-weight:600;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .image-item .fsize{
    font-size:12px;
    color:var(--muted);
  }
  .risk-badge{
    display:inline-block;
    margin-top:4px;
    font-size:10.5px;
    font-weight:700;
    color:#92400e;
    background:#fef3c7;
    border:1px solid #fde68a;
    border-radius:999px;
    padding:2px 8px;
    cursor:help;
  }
  .item-actions{
    display:flex;
    gap:4px;
    flex-shrink:0;
  }
  .icon-btn{
    width:32px;height:32px;
    border-radius:8px;
    border:1px solid var(--border);
    background:#fff;
    color:var(--muted);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:background .12s ease,color .12s ease;
  }
  .icon-btn:hover:not(:disabled){background:var(--primary-light);color:var(--primary-dark);}
  .icon-btn:disabled{opacity:.35;cursor:not-allowed;}
  .icon-btn.danger:hover:not(:disabled){background:#fde2e7;color:var(--danger);}
  .icon-btn svg{width:16px;height:16px;}

  .progress-wrap{margin-top:18px;display:none;}
  .progress-wrap.active{display:block;}
  .progress-track{
    width:100%;
    height:10px;
    background:var(--primary-light);
    border-radius:999px;
    overflow:hidden;
  }
  .progress-bar{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--primary),var(--primary-dark));
    border-radius:999px;
    transition:width .2s ease;
  }
  .status-text{
    margin-top:10px;
    font-size:13.5px;
    color:var(--muted);
    text-align:center;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .status-text.success{color:var(--success);font-weight:700;}
  .status-text.error{color:var(--danger);font-weight:700;}

  .spinner{
    width:15px;height:15px;
    border-radius:50%;
    border:2px solid var(--primary-light);
    border-top-color:var(--primary);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .privacy-note{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:13px;
    color:var(--muted);
    margin-top:22px;
    text-align:center;
  }
  .privacy-note svg{width:15px;height:15px;flex-shrink:0;color:var(--primary);}

  footer{
    padding:24px 0 34px;
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
  }

  .ad-slot{
    margin:24px 0 0;
    text-align:center;
    min-height:0;
  }

  [hidden]{display:none !important;}

  @media (max-width:520px){
    .card{padding:18px;border-radius:16px;}
    .dropzone{padding:26px 14px;}
    .list-actions{width:100%;}
    .list-actions .btn{flex:1;}
  }
</style>
</head>

            <button type="button" class="btn btn-ghost" id="clearBtn" data-i18n="clearBtn">Limpar tudo</button>

        </div>

        <div class="image-list" id="imageList"></div>

        <button type="button" class="btn btn-primary btn-block btn-lg" id="createBtn" data-i18n="createBtn">Criar e baixar PDF</button>

        <div class="progress-wrap" id="progressWrap">
          <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
          <div class="status-text" id="statusText"></div>
        </div>
      </section>
    </div>

    <div class="ad-slot">
      <ins class="adsbygoogle"
           style="display:block"
           data-ad-client="ca-pub-6858529705565321"
           data-ad-slot="0000000000"
           data-ad-format="auto"
           data-full-width-responsive="true"></ins>
    </div>

    <p class="privacy-note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      <span data-i18n="privacyText">Suas imagens são processadas localmente no seu navegador.</span>
    </p>

  </div>
</main>

<footer>
  <div class="container">Pixora PDF · <span id="year"></span></div>
</footer>

function detectLang(){
  var raw = (navigator.language || navigator.userLanguage || "en").toLowerCase();
  var code = raw.split("-")[0];
  return I18N.hasOwnProperty(code) ? code : "en";
}

    var key = nodes[i].getAttribute("data-i18n");
    if (T[key]) nodes[i].textContent = T[key];
  }
}

/* =========================================================
   2) ESTADO E REFERÊNCIAS DOM
   ========================================================= */
var state = {
  items: [],     // { id, file, thumbUrl, name, size }
  isProcessing: false
};
var nextId = 1;

var dropzone   = document.getElementById("dropzone");
var fileInput  = document.getElementById("fileInput");
var selectBtn  = document.getElementById("selectBtn");
var addMoreBtn = document.getElementById("addMoreBtn");
var clearBtn   = document.getElementById("clearBtn");
var createBtn  = document.getElementById("createBtn");
var listSection= document.getElementById("listSection");
var imageList  = document.getElementById("imageList");
var countLabel = document.getElementById("countLabel");
var progressWrap = document.getElementById("progressWrap");
var progressBar  = document.getElementById("progressBar");
var statusText   = document.getElementById("statusText");

/* =========================================================
   3) SELEÇÃO / DRAG & DROP DE ARQUIVOS
   ========================================================= */
function openFileDialog(){
  fileInput.value = "";
  fileInput.click();
}
selectBtn.addEventListener("click", openFileDialog);
addMoreBtn.addEventListener("click", openFileDialog);
dropzone.addEventListener("click", function(e){
  if (e.target === selectBtn) return;
  openFileDialog();
});

fileInput.addEventListener("change", function(){
  addFiles(fileInput.files);
});

["dragenter","dragover"].forEach(function(evt){
  dropzone.addEventListener(evt, function(e){
    e.preventDefault(); e.stopPropagation();
    dropzone.classList.add("drag-over");
  });
});
["dragleave","dragend","drop"].forEach(function(evt){
  dropzone.addEventListener(evt, function(e){
    e.preventDefault(); e.stopPropagation();
    dropzone.classList.remove("drag-over");
  });
});
dropzone.addEventListener("drop", function(e){
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length){
    addFiles(e.dataTransfer.files);
  }
});

var IMAGE_EXT_RE = /\.(jpe?g|png|webp|gif|bmp|heic|heif|tiff?|avif|svg)$/i;

function addFiles(fileList){
  var newItems = [];
  for (var i = 0; i < fileList.length; i++){
    var f = fileList[i];
    var typeOk = f.type && f.type.indexOf("image/") === 0;
    var extOk = IMAGE_EXT_RE.test(f.name || "");
    // Aceita pelo MIME type OU pela extensão: alguns navegadores/celulares
    // entregam arquivos de imagem (ex.: HEIC) sem MIME type definido.
    if (!typeOk && !extOk) continue;

    var thumbUrl;
    try{
      thumbUrl = URL.createObjectURL(f);
    } catch(err){
      continue;
    }
    var item = {
      id: nextId++,
      file: f,
      thumbUrl: thumbUrl,
      name: f.name || "imagem",
      size: f.size || 0,
      kind: null,
      riskyFormat: false
    };
    state.items.push(item);
    newItems.push(item);
  }
  if (newItems.length){
    listSection.hidden = false;
    renderList();
    // Detecta o formato real (pelos bytes do arquivo) em segundo plano e
    // sinaliza na lista os arquivos que podem não ser suportados (ex.: HEIC).
    newItems.forEach(function(item){
      detectImageKind(item.file).then(function(kind){
        item.kind = kind;
        item.riskyFormat = !!RISKY_KINDS[kind];
        renderList();
      });
    });
  }
}

/* =========================================================
   4) RENDERIZAÇÃO DA LISTA
   ========================================================= */
function formatSize(bytes){
  if (!bytes && bytes !== 0) return "";
  if (bytes < 1024) return bytes + " B";
  if (bytes < 1024*1024) return (bytes/1024).toFixed(0) + " KB";
  return (bytes/(1024*1024)).toFixed(1) + " MB";
}

function svgUp(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>';
}
function svgDown(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>';
}
function svgTrash(){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>';
}

function renderList(){
  countLabel.textContent = T.count(state.items.length);
  imageList.innerHTML = "";

  var frag = document.createDocumentFragment();
  state.items.forEach(function(item, idx){
    var row = document.createElement("div");
    row.className = "image-item";

    var num = document.createElement("div");
    num.className = "num";
    num.textContent = (idx + 1);
    row.appendChild(num);

    var thumb = document.createElement("img");
    thumb.className = "thumb";
    thumb.src = item.thumbUrl;
    thumb.alt = item.name;
    thumb.onerror = function(){
      this.onerror = null;
      this.src = PLACEHOLDER_THUMB;
    };
    row.appendChild(thumb);

    var meta = document.createElement("div");
    meta.className = "meta";
    var fname = document.createElement("div");
    fname.className = "fname";
    fname.textContent = item.name;
    meta.appendChild(fname);
    var fsize = document.createElement("div");
    fsize.className = "fsize";
    fsize.textContent = formatSize(item.size);
    meta.appendChild(fsize);
    if (item.riskyFormat){
      var badge = document.createElement("div");
      badge.className = "risk-badge";
      badge.textContent = T.riskyBadge;
      badge.title = T.riskyTooltip;
      meta.appendChild(badge);
    }
    row.appendChild(meta);

    var actions = document.createElement("div");
    actions.className = "item-actions";

    var upBtn = document.createElement("button");
    upBtn.type = "button";
    upBtn.className = "icon-btn";
    upBtn.title = T.moveUp;
    upBtn.setAttribute("aria-label", T.moveUp);
    upBtn.innerHTML = svgUp();
    upBtn.disabled = idx === 0 || state.isProcessing;
    upBtn.addEventListener("click", function(){ moveItem(idx, -1); });

    var downBtn = document.createElement("button");
    downBtn.type = "button";
    downBtn.className = "icon-btn";
    downBtn.title = T.moveDown;
    downBtn.setAttribute("aria-label", T.moveDown);
    downBtn.innerHTML = svgDown();
    downBtn.disabled = idx === state.items.length - 1 || state.isProcessing;
    downBtn.addEventListener("click", function(){ moveItem(idx, 1); });

    var removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.className = "icon-btn danger";
    removeBtn.title = T.remove;
    removeBtn.setAttribute("aria-label", T.remove);
    removeBtn.innerHTML = svgTrash();
    removeBtn.disabled = state.isProcessing;
    removeBtn.addEventListener("click", function(){ removeItem(idx); });

    actions.appendChild(upBtn);
    actions.appendChild(downBtn);
    actions.appendChild(removeBtn);
    row.appendChild(actions);

    frag.appendChild(row);
  });
  imageList.appendChild(frag);

  createBtn.disabled = state.items.length === 0 || state.isProcessing;
}

function moveItem(index, dir){
  var newIndex = index + dir;
  if (newIndex < 0 || newIndex >= state.items.length) return;
  var tmp = state.items[index];
  state.items[index] = state.items[newIndex];
  state.items[newIndex] = tmp;
  renderList();
}

function removeItem(index){
  var item = state.items[index];
  if (item && item.thumbUrl){
    try{ URL.revokeObjectURL(item.thumbUrl); } catch(e){}
  }
  state.items.splice(index, 1);
  if (state.items.length === 0){
    listSection.hidden = true;
  }
  renderList();
}

function clearAll(){
  state.items.forEach(function(item){
    if (item.thumbUrl){
      try{ URL.revokeObjectURL(item.thumbUrl); } catch(e){}
    }
  });
  state.items = [];
  listSection.hidden = true;
  progressWrap.classList.remove("active");
  statusText.textContent = "";
  statusText.className = "status-text";
  renderList();
}
clearBtn.addEventListener("click", clearAll);

/* =========================================================
   5) UTILITÁRIOS DE IMAGEM (Canvas -> JPEG -> bytes)
   ========================================================= */
// --- Detecção de formato real do arquivo pelos "magic bytes" (não confia na extensão) ---
function detectImageKind(file){
  return file.slice(0, 32).arrayBuffer().then(function(buf){
    var b = new Uint8Array(buf);
    function eq(offset, arr){
      if (offset + arr.length > b.length) return false;
      for (var i = 0; i < arr.length; i++){ if (b[offset + i] !== arr[i]) return false; }
      return true;
    }
    if (eq(0, [0xFF,0xD8,0xFF])) return "jpeg";
    if (eq(0, [0x89,0x50,0x4E,0x47])) return "png";
    if (eq(0, [0x47,0x49,0x46,0x38])) return "gif";
    if (eq(0, [0x42,0x4D])) return "bmp";
    if (eq(0, [0x52,0x49,0x46,0x46]) && eq(8, [0x57,0x45,0x42,0x50])) return "webp";
    if (eq(4, [0x66,0x74,0x79,0x70])){ // 'ftyp' box (ISO base media: HEIC/HEIF/AVIF)
      var brand = String.fromCharCode(b[8]||0, b[9]||0, b[10]||0, b[11]||0);
      if (["heic","heix","hevc","hevx","mif1","msf1","heim","heis","hevm","hevs"].indexOf(brand) !== -1) return "heic";
      if (["avif","avis"].indexOf(brand) !== -1) return "avif";
      return "unknown";
    }
    if (eq(0, [0x49,0x49,0x2A,0x00]) || eq(0, [0x4D,0x4D,0x00,0x2A])) return "tiff";
    if (eq(0, [0x25,0x50,0x44,0x46])) return "pdf";
    var text = "";
    for (var j = 0; j < Math.min(b.length, 24); j++){ text += String.fromCharCode(b[j]); }
    if (text.indexOf("<svg") !== -1 || text.indexOf("<?xml") !== -1) return "svg";
    return "unknown";
  }).catch(function(){ return "unknown"; });
}
var RISKY_KINDS = { heic: true, tiff: true, pdf: true, unknown: true };

function loadImageElement(url, timeoutMs){
  return new Promise(function(resolve, reject){
    var settled = false;
    var img = new Image();
    var timer = setTimeout(function(){
      if (settled) return;
      settled = true;
      reject(new Error("Tempo esgotado ao carregar a imagem (formato provavelmente não suportado pelo navegador)"));
    }, timeoutMs);
    img.onload = function(){
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      resolve(img);
    };
    img.onerror = function(){
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      reject(new Error("Falha ao carregar imagem (formato não suportado pelo navegador)"));
    };
    img.src = url;
  });
}

function decodeViaImgTag(file, timeoutMs){
  return new Promise(function(resolve, reject){
    var objUrl;
    try{ objUrl = URL.createObjectURL(file); } catch(e){ reject(e); return; }
    loadImageElement(objUrl, timeoutMs).then(function(img){
      resolve({
        source: img,
        width: img.naturalWidth || img.width,
        height: img.naturalHeight || img.height,
        close: function(){ try{ URL.revokeObjectURL(objUrl); } catch(e){} }
      });
    }, function(err){
      try{ URL.revokeObjectURL(objUrl); } catch(e2){}
      reject(err);
    });
  });
}

// Tenta createImageBitmap primeiro (mais robusto e rápido); cai para <img> se indisponível/falhar.
function decodeImageSource(file, riskyFormat){
  var timeoutMs = riskyFormat ? 4000 : 15000;
  if (typeof window.createImageBitmap === "function"){
    return createImageBitmap(file).then(function(bitmap){
      return {
        source: bitmap,
        width: bitmap.width,
        height: bitmap.height,
        close: function(){ try{ bitmap.close(); } catch(e){} }
      };
    }).catch(function(){
      return decodeViaImgTag(file, timeoutMs);
    });
  }
  return decodeViaImgTag(file, timeoutMs);
}

function base64ToUint8Array(base64){
  var binStr = atob(base64);
  var len = binStr.length;
  var bytes = new Uint8Array(len);
  for (var i = 0; i < len; i++){
    bytes[i] = binStr.charCodeAt(i);
  }
  return bytes;
}

// Converte um canvas para bytes JPEG usando toBlob (evita limites de string base64
// em fotos grandes); cai para toDataURL apenas em navegadores muito antigos.
function canvasToJpegBytes(canvas, quality){
  return new Promise(function(resolve, reject){
    if (canvas.toBlob){
      canvas.toBlob(function(blob){
        if (!blob){ reject(new Error("Falha ao gerar JPEG do canvas")); return; }
        blob.arrayBuffer().then(function(buf){
          resolve(new Uint8Array(buf));
        }, reject);
      }, "image/jpeg", quality);
    } else {
      try{
        var dataUrl = canvas.toDataURL("image/jpeg", quality);
        var commaIdx = dataUrl.indexOf(",");
        if (commaIdx === -1) throw new Error("dataURL inválida");
        resolve(base64ToUint8Array(dataUrl.substring(commaIdx + 1)));
      } catch(e){ reject(e); }
    }
  });
}

function fileToJpegData(file, maxDim, quality, riskyFormat, attempt){
  attempt = attempt || 1;
  return decodeImageSource(file, riskyFormat).then(function(decoded){
    return new Promise(function(resolve, reject){
      try{
        var w = decoded.width;
        var h = decoded.height;
        if (!w || !h) throw new Error("Dimensões inválidas");

        if (w > maxDim || h > maxDim){
          var s = Math.min(maxDim / w, maxDim / h);
          w = Math.max(1, Math.round(w * s));
          h = Math.max(1, Math.round(h * s));
        }

        var canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#FFFFFF";
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(decoded.source, 0, 0, w, h);
        decoded.close();

        canvasToJpegBytes(canvas, quality).then(function(bytes){
          resolve({ jpegBytes: bytes, width: w, height: h });
        }, reject);
      } catch(err){
        try{ decoded.close(); } catch(e2){}
        reject(err);
      }
    });
  }).catch(function(err){
    // Retry automático com resolução/qualidade menor (mitiga limites de memória
    // de canvas em fotos muito grandes de celular).
    if (attempt < 3 && maxDim > 700){
      return fileToJpegData(file, Math.round(maxDim * 0.6), Math.max(0.6, quality - 0.1), riskyFormat, attempt + 1);
    }
    throw err;
  });
}

/* =========================================================
   6) GERADOR DE PDF (implementação manual, byte a byte)
   ========================================================= */
function buildPdfBytes(images){
  var A4_W = 595.28, A4_H = 841.89, MARGIN = 20;
  var encoder = new TextEncoder();
  var parts = [];
  var offset = 0;
  var offsets = {};

  function pushStr(s){
    var b = encoder.encode(s);
    parts.push(b);
    offset += b.length;
  }
  function pushBytes(b){
    parts.push(b);
    offset += b.length;
  }
  function pad10(n){
    var s = String(Math.floor(n));
    while (s.length < 10) s = "0" + s;
    return s;
  }

  // Cabeçalho do PDF + marcador binário recomendado
  pushStr("%PDF-1.4\n");
  pushBytes(new Uint8Array([0x25, 0xE2, 0xE3, 0xCF, 0xD3, 0x0A]));

  var n = images.length;
  var totalObjs = 2 + n * 3;

  var kids = [];
  for (var i = 0; i < n; i++){ kids.push(3 + i * 3); }

  // Objeto 1: Catalog
  offsets[1] = offset;
  pushStr("1 0 obj\n<< /Type /Catalog /Pages 2 0 R >>\nendobj\n");

  // Objeto 2: Pages
  var kidsRefs = kids.map(function(k){ return k + " 0 R"; }).join(" ");
  offsets[2] = offset;
  pushStr("2 0 obj\n<< /Type /Pages /Kids [" + kidsRefs + "] /Count " + n + " >>\nendobj\n");

  for (var idx = 0; idx < n; idx++){
    var img = images[idx];
    var pageNum = 3 + idx * 3;
    var contentNum = 4 + idx * 3;
    var imageNum = 5 + idx * 3;

    var landscape = img.width > img.height;
    var PW = landscape ? A4_H : A4_W;
    var PH = landscape ? A4_W : A4_H;
    var availW = PW - MARGIN * 2;
    var availH = PH - MARGIN * 2;
    var scale = Math.min(availW / img.width, availH / img.height);
    var drawW = img.width * scale;
    var drawH = img.height * scale;
    var x = (PW - drawW) / 2;
    var y = (PH - drawH) / 2;

    var contentStr = "q\n" + drawW.toFixed(2) + " 0 0 " + drawH.toFixed(2) + " " +
      x.toFixed(2) + " " + y.toFixed(2) + " cm\n/Im0 Do\nQ";
    var contentBytes = encoder.encode(contentStr);

    // Page
    offsets[pageNum] = offset;
    pushStr(
      pageNum + " 0 obj\n<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " +
      PW.toFixed(2) + " " + PH.toFixed(2) +
      "] /Resources << /ProcSet [/PDF /ImageC] /XObject << /Im0 " + imageNum + " 0 R >> >> /Contents " +
      contentNum + " 0 R >>\nendobj\n"
    );

    // Content stream
    offsets[contentNum] = offset;
    pushStr(contentNum + " 0 obj\n<< /Length " + contentBytes.length + " >>\nstream\n");
    pushBytes(contentBytes);
    pushStr("\nendstream\nendobj\n");

    // Image XObject
    offsets[imageNum] = offset;
    pushStr(
      imageNum + " 0 obj\n<< /Type /XObject /Subtype /Image /Width " + img.width +
      " /Height " + img.height +
      " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " +
      img.jpegBytes.length + " >>\nstream\n"
    );
    pushBytes(img.jpegBytes);
    pushStr("\nendstream\nendobj\n");
  }

  // Tabela xref
  var xrefOffset = offset;
  pushStr("xref\n0 " + (totalObjs + 1) + "\n");
  pushStr("0000000000 65535 f \n");
  for (var num = 1; num <= totalObjs; num++){
    pushStr(pad10(offsets[num]) + " 00000 n \n");
  }

  // Trailer
  pushStr(
    "trailer\n<< /Size " + (totalObjs + 1) + " /Root 1 0 R >>\nstartxref\n" +
    xrefOffset + "\n%%EOF"
  );

  var total = 0;
  for (var p = 0; p < parts.length; p++){ total += parts[p].length; }
  var out = new Uint8Array(total);
  var pos = 0;
  for (var q = 0; q < parts.length; q++){
    out.set(parts[q], pos);
    pos += parts[q].length;
  }
  return out;
}

/* =========================================================
   7) FLUXO PRINCIPAL: CRIAR E BAIXAR O PDF
   ========================================================= */
function pad2(n){ return n < 10 ? "0" + n : "" + n; }

function setControlsDisabled(disabled){
  state.isProcessing = disabled;
  createBtn.disabled = disabled || state.items.length === 0;
  addMoreBtn.disabled = disabled;
  clearBtn.disabled = disabled;
  selectBtn.disabled = disabled;
  renderList();
}

function updateProgress(pct){
  progressBar.style.width = pct + "%";
}

function setStatus(text, cls){
  statusText.innerHTML = "";
  if (cls === "loading"){
    var sp = document.createElement("div");
    sp.className = "spinner";
    statusText.appendChild(sp);
    var span = document.createElement("span");
    span.textContent = text;
    statusText.appendChild(span);
    statusText.className = "status-text";
  } else {
    statusText.textContent = text;
    statusText.className = "status-text" + (cls ? (" " + cls) : "");
  }
}

function yieldToUI(){
  return new Promise(function(resolve){
    if (window.requestAnimationFrame){
      requestAnimationFrame(function(){ setTimeout(resolve, 0); });
    } else {
      setTimeout(resolve, 0);
    }
  });
}

async function handleCreatePdf(){
  if (state.isProcessing || state.items.length === 0) return;

  setControlsDisabled(true);
  progressWrap.classList.add("active");
  updateProgress(0);
  setStatus(T.creating, "loading");

  try{
    var total = state.items.length;
    var images = [];
    var failedCount = 0;

    for (var i = 0; i < total; i++){
      var item = state.items[i];
      try{
        var data = await fileToJpegData(item.file, 2000, 0.85, item.riskyFormat);
        images.push(data);
      } catch(imgErr){
        failedCount++;
        if (window.console && console.warn){
          console.warn("Pixora PDF: falha ao processar '" + item.name + "':", imgErr);
        }
      }
      updateProgress(Math.round(((i + 1) / total) * 90));
      await yieldToUI();
    }

    if (images.length === 0){
      setStatus(T.errorNoneSucceeded || T.errorGeneric, "error");
      return;
    }

    var pdfBytes = buildPdfBytes(images);
    updateProgress(97);
    await yieldToUI();

    var blob = new Blob([pdfBytes], { type: "application/pdf" });
    var blobUrl = URL.createObjectURL(blob);

    var now = new Date();
    var filename = "pixora-" + now.getFullYear() + "-" + pad2(now.getMonth() + 1) + "-" + pad2(now.getDate()) + ".pdf";

    var a = document.createElement("a");
    a.href = blobUrl;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    setTimeout(function(){
      try{ URL.revokeObjectURL(blobUrl); } catch(e){}
    }, 4000);

    updateProgress(100);
    if (failedCount > 0 && T.errorSomeFailed){
      setStatus(T.errorSomeFailed(failedCount), "error");
    } else {
      setStatus(T.success, "success");
    }
  } catch(err){
    if (window.console && console.error){ console.error("Pixora PDF:", err); }
    setStatus(T.errorGeneric, "error");
  } finally{
    setControlsDisabled(false);
  }
}

createBtn.addEventListener("click", function(){
  handleCreatePdf();
});

   8) INICIALIZAÇÃO

applyTranslations();
document.getElementById("year").textContent = new Date().getFullYear();
renderList();
