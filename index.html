<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>HydraQuest — Transforme seus hábitos em uma aventura</title>
<meta name="theme-color" content="#0B1826">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%A7%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* =========================================================
   HYDRAQUEST — design tokens
   ========================================================= */
:root{
  --bg:#0B1826;
  --bg-2:#0F2136;
  --bg-elevated:#142A3D;
  --card:#1B3350;
  --card-2:#203C5C;
  --border:rgba(140,190,200,.14);
  --text:#EAF4F4;
  --text-dim:#9FB8C4;
  --text-faint:#6C8494;
  --aqua:#49E0D2;
  --aqua-dim:#2C8B84;
  --gold:#E8C468;
  --ember:#F2895A;
  --violet:#9C8FE8;
  --green:#6FCF7B;
  --danger:#E8615D;
  --shadow: 0 12px 32px rgba(0,0,0,.35);
  --radius: 18px;
  --font-display:'Cinzel', serif;
  --font-body:'Nunito', system-ui, sans-serif;
  --font-mono:'JetBrains Mono', monospace;
  --nav-h: 72px;
  --safe-b: env(safe-area-inset-bottom, 0px);
}
[data-theme="light"]{
  --bg:#EFF6F5;
  --bg-2:#E4EFEE;
  --bg-elevated:#FFFFFF;
  --card:#FFFFFF;
  --card-2:#F3FAF9;
  --border:rgba(30,70,80,.12);
  --text:#122A33;
  --text-dim:#4C6B75;
  --text-faint:#8AA2AA;
  --shadow: 0 10px 26px rgba(20,60,70,.12);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 800px at 50% -10%, var(--bg-2), var(--bg));
  color:var(--text);
  font-family:var(--font-body);
  min-height:100vh;
  overflow-x:hidden;
  transition:background .4s ease, color .3s ease;
}
h1,h2,h3,.font-display{font-family:var(--font-display);}
button{font-family:inherit;}
img{max-width:100%;display:block;}
.hidden{display:none !important;}
::selection{background:var(--aqua); color:#03211F;}
a{color:var(--aqua);}
.scrim{position:fixed;inset:0;background:rgba(4,10,16,.62);backdrop-filter:blur(3px);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:760px){.scrim{align-items:center;}}

/* -------- scrollbars -------- */
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--card-2);border-radius:8px;}

/* =========================================================
   SPLASH
   ========================================================= */
#splash{
  position:fixed; inset:0; z-index:100;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  background:
    radial-gradient(700px 500px at 50% 20%, rgba(73,224,210,.16), transparent 60%),
    linear-gradient(180deg, #081420 0%, #0B1826 55%, #0A1B2C 100%);
  color:#fff; text-align:center; cursor:pointer;
}
#splash .drop{
  font-size:64px; animation:floaty 2.6s ease-in-out infinite;
  filter:drop-shadow(0 0 22px rgba(73,224,210,.55));
}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
#splash h1{
  font-size:clamp(30px,7vw,52px); letter-spacing:.06em; margin:0;
  background:linear-gradient(90deg,#49E0D2,#E8C468);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
#splash p{color:var(--text-dim); margin:0; font-size:15px; max-width:280px;}
#splash .tap{margin-top:26px; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--text-faint); animation:pulse 1.8s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
#splash .ring{position:absolute; width:280px; height:280px; border-radius:50%; border:1px solid rgba(73,224,210,.18); animation:ringgrow 3.2s ease-out infinite;}
@keyframes ringgrow{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.5);opacity:0}}

/* =========================================================
   ONBOARDING
   ========================================================= */
#onboarding{position:fixed; inset:0; z-index:90; background:var(--bg); display:flex; flex-direction:column;}
.ob-progress{display:flex; gap:6px; padding:18px 20px 0;}
.ob-progress i{flex:1; height:4px; border-radius:4px; background:var(--card);}
.ob-progress i.on{background:var(--aqua);}
.ob-body{flex:1; overflow-y:auto; padding:24px 22px 140px; max-width:520px; margin:0 auto; width:100%;}
.ob-body h2{font-size:24px; margin:6px 0 8px;}
.ob-body p.sub{color:var(--text-dim); margin:0 0 22px; line-height:1.55;}
.ob-footer{position:fixed; left:0; right:0; bottom:0; padding:16px 20px calc(16px + var(--safe-b)); background:linear-gradient(180deg, transparent, var(--bg) 30%); display:flex; gap:10px; justify-content:center;}
.ob-footer .wrap{max-width:520px; width:100%; display:flex; gap:10px;}

.class-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.class-card{border:2px solid var(--border); border-radius:16px; padding:16px; background:var(--card); cursor:pointer; text-align:left; transition:.15s;}
.class-card.selected{border-color:var(--cc, var(--aqua)); box-shadow:0 0 0 3px color-mix(in srgb, var(--cc, var(--aqua)) 25%, transparent);}
.class-card .ic{font-size:30px;}
.class-card b{display:block; font-family:var(--font-display); font-size:16px; margin:8px 0 4px;}
.class-card span{font-size:12.5px; color:var(--text-dim); line-height:1.4;}

.avatar-pick{display:flex; align-items:center; gap:16px; margin-bottom:22px;}
.avatar-pick .ph{width:84px; height:84px; border-radius:50%; background:var(--card); border:2px dashed var(--border); display:flex; align-items:center; justify-content:center; font-size:34px; overflow:hidden; flex-shrink:0;}
.avatar-pick .ph img{width:100%; height:100%; object-fit:cover;}
.field{margin-bottom:16px;}
.field label{display:block; font-size:12.5px; color:var(--text-dim); margin-bottom:6px; font-weight:700; letter-spacing:.03em; text-transform:uppercase;}
.field input, .field select{width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:15px; font-family:inherit;}
.field input:focus, .field select:focus{outline:2px solid var(--aqua); outline-offset:1px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.stepper{display:flex; align-items:center; gap:14px; background:var(--card); border-radius:14px; padding:10px 14px; border:1px solid var(--border);}
.stepper button{width:34px;height:34px;border-radius:50%;border:none;background:var(--card-2);color:var(--text);font-size:18px;font-weight:800;cursor:pointer;}
.stepper .val{flex:1; text-align:center; font-family:var(--font-mono); font-weight:700; font-size:16px;}

/* =========================================================
   BUTTONS
   ========================================================= */
.btn{border:none; border-radius:14px; padding:14px 18px; font-weight:800; font-size:15px; cursor:pointer; transition:.15s transform, .15s filter; display:inline-flex; align-items:center; justify-content:center; gap:8px;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,#4CE8D8,#2FB6AC); color:#04241F; box-shadow:0 8px 20px rgba(73,224,210,.28);}
.btn-primary:disabled{opacity:.4; cursor:not-allowed;}
.btn-ghost{background:var(--card); color:var(--text); border:1px solid var(--border);}
.btn-gold{background:linear-gradient(135deg,#F3D27F,#E0AC3F); color:#2B1B02;}
.btn-danger{background:rgba(232,97,93,.14); color:var(--danger); border:1px solid rgba(232,97,93,.35);}
.btn-block{width:100%;}
.btn-sm{padding:9px 14px; font-size:13px; border-radius:11px;}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;}

/* =========================================================
   APP SHELL
   ========================================================= */
#app{display:none; min-height:100vh;}
#app.active{display:block;}
.shell{display:flex; min-height:100vh;}
.sidebar{display:none;}
.topbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border); padding:14px 18px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
.topbar .brand{display:flex; align-items:center; gap:8px; font-family:var(--font-display); font-weight:700; font-size:16px;}
.topbar .brand .d{font-size:20px;}
.topbar .right{display:flex; align-items:center; gap:8px;}
.streak-chip{display:flex; align-items:center; gap:5px; background:var(--card); border:1px solid var(--border); padding:7px 11px; border-radius:20px; font-family:var(--font-mono); font-size:13px; font-weight:700;}
main.view{max-width:640px; margin:0 auto; padding:18px 16px calc(var(--nav-h) + 26px + var(--safe-b)); width:100%;}

.bottom-nav{position:fixed; left:0; right:0; bottom:0; z-index:30; height:calc(var(--nav-h) + var(--safe-b)); padding-bottom:var(--safe-b); background:color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter:blur(12px); border-top:1px solid var(--border); display:flex;}
.bottom-nav button{flex:1; background:none; border:none; color:var(--text-faint); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; font-size:10.5px; font-weight:700; cursor:pointer; letter-spacing:.02em;}
.bottom-nav button .ic{font-size:21px; filter:grayscale(1); opacity:.6; transition:.15s;}
.bottom-nav button.active{color:var(--aqua);}
.bottom-nav button.active .ic{filter:none; opacity:1; transform:translateY(-2px);}

@media(min-width:900px){
  .shell{max-width:1180px; margin:0 auto;}
  .sidebar{display:flex; flex-direction:column; width:230px; flex-shrink:0; border-right:1px solid var(--border); padding:22px 14px; gap:4px; height:100vh; position:sticky; top:0;}
  .sidebar .brand{display:flex; align-items:center; gap:9px; font-family:var(--font-display); font-size:18px; font-weight:700; padding:6px 10px 22px;}
  .sidebar .brand .d{font-size:24px;}
  .sidebar button{display:flex; align-items:center; gap:12px; background:none; border:none; color:var(--text-dim); padding:12px 12px; border-radius:12px; font-size:14.5px; font-weight:700; cursor:pointer; text-align:left;}
  .sidebar button .ic{font-size:18px; opacity:.75;}
  .sidebar button.active{background:var(--card); color:var(--aqua);}
  .sidebar button.active .ic{opacity:1;}
  .bottom-nav{display:none;}
  main.view{max-width:680px; padding:26px 30px 40px;}
  .topbar{display:none;}
}

/* =========================================================
   CARDS / GENERIC
   ========================================================= */
.card{background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:var(--shadow);}
.section-title{display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px;}
.section-title h3{margin:0; font-size:14px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-dim);}
.section-title a, .section-title button.link{background:none; border:none; color:var(--aqua); font-weight:700; font-size:13px; cursor:pointer;}

/* dashboard hero */
.hero-card{background:linear-gradient(155deg, var(--card-2), var(--card)); border:1px solid var(--border); border-radius:22px; padding:20px; box-shadow:var(--shadow); position:relative; overflow:hidden;}
.hero-top{display:flex; align-items:center; gap:12px;}
.avatar{width:56px;height:56px;border-radius:50%; background:var(--card-2); border:2px solid var(--cc,var(--aqua)); display:flex; align-items:center; justify-content:center; font-size:24px; overflow:hidden; flex-shrink:0;}
.avatar img{width:100%; height:100%; object-fit:cover;}
.hero-name{font-family:var(--font-display); font-weight:700; font-size:17px;}
.hero-class{font-size:12.5px; color:var(--text-dim);}
.lvl-pill{margin-left:auto; background:var(--gold); color:#2B1B02; font-family:var(--font-mono); font-weight:800; font-size:13px; padding:6px 12px; border-radius:20px;}
.xpbar-wrap{margin-top:16px;}
.xpbar{height:12px; border-radius:8px; background:var(--bg-2); overflow:hidden; border:1px solid var(--border);}
.xpbar > i{display:block; height:100%; background:linear-gradient(90deg,#49E0D2,#8FF0E4); border-radius:8px; transition:width .5s cubic-bezier(.2,.9,.3,1);}
.xp-label{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11.5px; color:var(--text-dim); margin-top:6px;}

.monster-card{margin-top:16px; background:var(--bg-2); border-radius:16px; padding:16px; border:1px solid var(--border);}
.monster-top{display:flex; align-items:center; gap:12px;}
.monster-emoji{font-size:40px; transition:transform .15s;}
.monster-emoji.hit{animation:shake .32s;}
@keyframes shake{0%,100%{transform:translateX(0) scale(1)}25%{transform:translateX(-6px) scale(.95)}75%{transform:translateX(6px) scale(.95)}}
.monster-name{font-family:var(--font-display); font-weight:700; font-size:15px;}
.monster-region{font-size:11.5px; color:var(--text-faint);}
.hp-wrap{margin-top:10px;}
.hp-bar{height:10px; border-radius:8px; background:var(--bg); overflow:hidden; border:1px solid var(--border);}
.hp-bar > i{display:block; height:100%; background:linear-gradient(90deg,#E8615D,#F2895A); transition:width .4s ease;}
.hp-label{display:flex; justify-content:space-between; font-family:var(--font-mono); font-size:11px; color:var(--text-faint); margin-top:5px;}

.water-ring-wrap{display:flex; align-items:center; gap:16px; margin-top:16px;}
.water-ring{position:relative; width:88px; height:88px; flex-shrink:0;}
.water-ring svg{transform:rotate(-90deg);}
.water-ring .pct{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-weight:800; font-size:16px; color:var(--aqua);}
.water-info b{display:block; font-size:19px;}
.water-info span{font-size:12px; color:var(--text-dim);}

.cta-log{margin-top:16px; display:grid; grid-template-columns:1fr 1fr; gap:10px;}

/* missions */
.mission{display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--border);}
.mission:last-child{border-bottom:none;}
.mission .chk{width:26px;height:26px;border-radius:50%; border:2px solid var(--border); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:13px;}
.mission.done .chk{background:var(--green); border-color:var(--green); color:#06280C;}
.mission .txt{flex:1;}
.mission .txt b{display:block; font-size:14px;}
.mission.done .txt b{text-decoration:line-through; color:var(--text-faint);}
.mission .txt span{font-size:11.5px; color:var(--text-faint);}
.mission .xp{font-family:var(--font-mono); font-size:12px; color:var(--gold); font-weight:700;}

/* grids */
.stat-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:10px;}
.stat-box{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px;}
.stat-box b{display:block; font-size:20px; font-family:var(--font-mono);}
.stat-box span{font-size:11.5px; color:var(--text-dim);}

/* region map */
.region-path{display:flex; flex-direction:column; gap:0; margin-top:8px;}
.region-node{display:flex; align-items:center; gap:14px; padding:14px 4px; position:relative;}
.region-node .line{position:absolute; left:27px; top:56px; width:2px; height:calc(100% - 30px); background:var(--border);}
.region-node:last-child .line{display:none;}
.region-node .badge{width:54px;height:54px;border-radius:50%; background:var(--card); border:2px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:24px; flex-shrink:0; z-index:1;}
.region-node.unlocked .badge{border-color:var(--aqua); background:var(--card-2);}
.region-node.current .badge{box-shadow:0 0 0 4px rgba(73,224,210,.18);}
.region-node .info{flex:1;}
.region-node .info b{display:block; font-family:var(--font-display); font-size:15px;}
.region-node .info span{font-size:12px; color:var(--text-faint);}
.region-node.locked{opacity:.45;}

/* achievements */
.ach-tabs{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; margin-bottom:14px;}
.ach-tabs button{flex-shrink:0; padding:8px 14px; border-radius:20px; border:1px solid var(--border); background:var(--card); color:var(--text-dim); font-size:12.5px; font-weight:700; cursor:pointer;}
.ach-tabs button.active{background:var(--aqua); color:#04241F; border-color:var(--aqua);}
.ach-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
.ach-item{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 8px; text-align:center; cursor:pointer;}
.ach-item .ic{font-size:26px; margin-bottom:6px;}
.ach-item.locked{opacity:.35; filter:grayscale(1);}
.ach-item b{display:block; font-size:11px; line-height:1.25;}
.rarity-tag{display:inline-block; font-size:9.5px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:8px; margin-top:5px;}
.r-comum{background:rgba(159,184,196,.18); color:var(--text-dim);}
.r-incomum{background:rgba(111,207,123,.18); color:var(--green);}
.r-raro{background:rgba(73,224,210,.18); color:var(--aqua);}
.r-epico{background:rgba(156,143,232,.2); color:var(--violet);}
.r-lendario{background:rgba(232,196,104,.2); color:var(--gold);}

/* history */
.hist-day{margin-bottom:18px;}
.hist-day h4{font-family:var(--font-mono); font-size:12px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin:0 0 8px;}
.hist-item{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:12px 14px; margin-bottom:8px; cursor:pointer;}
.hist-item .ic{font-size:22px; width:32px; text-align:center; flex-shrink:0;}
.hist-item .txt{flex:1;}
.hist-item .txt b{display:block; font-size:14px;}
.hist-item .txt span{font-size:11.5px; color:var(--text-faint);}
.hist-item .xp{font-family:var(--font-mono); font-size:12px; color:var(--gold); font-weight:700; flex-shrink:0;}
.filter-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:6px;}
.filter-row button{flex-shrink:0; padding:8px 13px; border-radius:20px; border:1px solid var(--border); background:var(--card); color:var(--text-dim); font-size:12px; font-weight:700; cursor:pointer;}
.filter-row button.active{background:var(--card-2); color:var(--aqua); border-color:var(--aqua);}
.search-box{width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:14px; margin-bottom:12px;}
.empty-state{text-align:center; padding:40px 20px; color:var(--text-faint);}
.empty-state .ic{font-size:40px; margin-bottom:10px;}

/* settings / profile */
.list-group{background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden;}
.list-row{display:flex; align-items:center; gap:12px; padding:15px 16px; border-bottom:1px solid var(--border); cursor:pointer;}
.list-row:last-child{border-bottom:none;}
.list-row .ic{font-size:18px; width:22px; text-align:center;}
.list-row .lbl{flex:1; font-size:14.5px; font-weight:700;}
.list-row .val{color:var(--text-faint); font-size:13px;}
.list-row .chev{color:var(--text-faint);}
.toggle{width:46px; height:27px; border-radius:20px; background:var(--bg-2); border:1px solid var(--border); position:relative; cursor:pointer; flex-shrink:0;}
.toggle.on{background:var(--aqua);}
.toggle i{position:absolute; top:2px; left:2px; width:21px; height:21px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 1px 3px rgba(0,0,0,.3);}
.toggle.on i{left:21px;}

/* modals */
.modal{width:100%; max-width:480px; background:var(--bg-elevated); border-radius:22px 22px 0 0; padding:22px 20px calc(22px + var(--safe-b)); max-height:88vh; overflow-y:auto; animation:slideup .25s ease;}
@media(min-width:760px){.modal{border-radius:22px; padding-bottom:22px;}}
@keyframes slideup{from{transform:translateY(30px); opacity:0} to{transform:translateY(0); opacity:1}}
.modal-handle{width:40px; height:4px; background:var(--border); border-radius:4px; margin:0 auto 16px;}
.modal h3{margin:0 0 4px; font-size:19px;}
.modal p.sub{color:var(--text-dim); font-size:13.5px; margin:0 0 18px;}
.qty-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;}
.qty-btn{padding:14px 4px; border-radius:12px; border:1px solid var(--border); background:var(--card); color:var(--text); font-family:var(--font-mono); font-weight:800; font-size:13px; cursor:pointer;}
.qty-btn.selected{background:var(--aqua); color:#04241F; border-color:var(--aqua);}
.cat-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:14px;}
.cat-btn{padding:14px 6px; border-radius:14px; border:1px solid var(--border); background:var(--card); cursor:pointer; text-align:center;}
.cat-btn.selected{border-color:var(--aqua); background:var(--card-2);}
.cat-btn .ic{font-size:22px;}
.cat-btn b{display:block; font-size:11px; margin-top:5px; font-weight:700;}
.modal-actions{display:flex; gap:10px; margin-top:6px;}
.modal-actions .btn{flex:1;}
.toast-modal{text-align:center; padding-top:6px;}
.toast-modal .big-ic{font-size:64px; margin-bottom:10px;}
.toast-modal h2{margin:0 0 6px; font-size:24px;}
.toast-modal p{color:var(--text-dim); margin:0 0 20px; font-size:14px;}
.reward-row{display:flex; justify-content:center; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
.reward-chip{background:var(--card); border:1px solid var(--border); padding:8px 14px; border-radius:20px; font-family:var(--font-mono); font-weight:700; font-size:13px;}

/* toast (top) */
#toast-stack{position:fixed; top:16px; left:0; right:0; z-index:200; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none;}
.toast{background:var(--bg-elevated); border:1px solid var(--border); box-shadow:var(--shadow); border-radius:14px; padding:11px 18px; font-size:13.5px; font-weight:700; display:flex; align-items:center; gap:8px; animation:toastin .25s ease;}
@keyframes toastin{from{opacity:0; transform:translateY(-10px)} to{opacity:1; transform:translateY(0)}}

/* certificate */
.cert-canvas-wrap{background:#0a1520; border-radius:14px; padding:8px; margin-bottom:16px; overflow:hidden;}
.cert-canvas-wrap canvas{width:100%; height:auto; border-radius:8px; display:block;}

/* charts */
.chart-wrap{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px;}
.chart-wrap canvas{width:100%; height:170px;}
.legend-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:10px; font-size:11.5px; color:var(--text-dim);}
.legend-row .dot{width:9px; height:9px; border-radius:50%; display:inline-block; margin-right:5px;}

/* misc */
.note-banner{background:rgba(232,196,104,.1); border:1px solid rgba(232,196,104,.3); color:var(--gold); font-size:12.5px; padding:11px 14px; border-radius:12px; line-height:1.5; margin-bottom:16px;}
.divider{height:1px; background:var(--border); margin:18px 0;}
.text-center{text-align:center;}
.mt-0{margin-top:0;}
#confetti-layer{position:fixed; inset:0; pointer-events:none; z-index:150; overflow:hidden;}
.confetti-piece{position:absolute; top:-20px; border-radius:2px; animation:confettifall linear forwards;}
@keyframes confettifall{to{transform:translateY(110vh) rotate(540deg); opacity:.2;}}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
}

<script>
"use strict";
/* =========================================================================================
   HYDRAQUEST — RPG de hábitos saudáveis
   App 100% client-side. Dados salvos em localStorage. Sem backend, sem contas, sem cobrança.
   ========================================================================================= */

/* ---------------------------- DADOS DE JOGO (config) ---------------------------- */

const ACHIEVEMENTS = [

  {id:'colorful',      name:'Prato Colorido',       ic:'🥗', rarity:'incomum',  hidden:false, desc:'Registre fruta, vegetal e proteína no mesmo dia.'},
  {id:'explorer',      name:'Explorador',           ic:'🗺️', rarity:'raro',     hidden:false, desc:'Desbloqueie 3 regiões do mapa.'},
  {id:'slayer10',      name:'Caçador de Monstros',  ic:'⚔️', rarity:'incomum',  hidden:false, desc:'Derrote 10 monstros.'},
  {id:'slayer50',      name:'Lenda dos Monstros',   ic:'🐉', rarity:'epico',    hidden:false, desc:'Derrote 50 monstros.'},

  {id:'level35',       name:'Lendário',             ic:'👑', rarity:'lendario', hidden:false, desc:'Alcance o nível 35.'},
  {id:'liters100',     name:'100 Litros',           ic:'🪣', rarity:'raro',     hidden:false, desc:'Registre 100 litros de água no total.'},
  {id:'night_owl',     name:'Coruja Noturna',       ic:'🦉', rarity:'raro',     hidden:true,  desc:'Registre algo entre meia-noite e 1h.'},
  {id:'early_bird',    name:'Ave Madrugadora',      ic:'🐦', rarity:'raro',     hidden:true,  desc:'Registre algo antes das 6h.'},
  {id:'variety',       name:'Colecionador',         ic:'🎒', rarity:'incomum',  hidden:true,  desc:'Registre 6 categorias diferentes no total.'},
];

const CERT_MILESTONES = ['streak_7','streak_30','streak_100','level10','level20','level35','slayer50'];

const MISSION_POOL = [
  {id:'m_water', label:'Registrar sua hidratação', ic:'💧', xp:20, check:(day)=>day.some(l=>l.type==='water')},
  {id:'m_fruit', label:'Registrar uma fruta', ic:'🍎', xp:20, check:(day)=>day.some(l=>l.cat==='fruit')},
  {id:'m_veg', label:'Registrar vegetais', ic:'🥦', xp:20, check:(day)=>day.some(l=>l.cat==='veg')},
  {id:'m_protein', label:'Registrar proteína', ic:'🥩', xp:20, check:(day)=>day.some(l=>l.cat==='protein')},
  {id:'m_five', label:'Completar 5 registros hoje', ic:'⭐', xp:30, check:(day)=>day.length>=5},
  {id:'m_three_cats', label:'Registrar 3 categorias diferentes', ic:'🎯', xp:25, check:(day)=>new Set(day.map(l=>l.cat)).size>=3},
];

const RARITY_LABEL = {comum:'Comum', incomum:'Incomum', raro:'Raro', epico:'Épico', lendario:'Lendário'};

/* ---------------------------- ESTADO ---------------------------- */
let state = loadState();
let ui = { view:'dashboard', historyFilter:'all', historyRange:'today', historySearch:'', achTab:'todas', onboardStep:0, theme: state?.settings?.theme || 'dark' };

function defaultState(){
  return {
    onboarded:false,
    user:{ name:'', photo:null, classId:'hidromante', wake:'07:00', sleep:'23:00', reminderCount:3, reminderInterval:120, hydrationGoal:2000 },
    progress:{ level:1, xp:0, streak:0, longestStreak:0, lastActiveDate:null, joinDate:null, monstersDefeated:0, regionsSeen:['vale'] },
    monster:{ regionId:'vale', idx:0, hp:0, hpMax:0 },
    logs:[],           // {id, type:'water'|'food', cat, amount, unit, ts, xp}
    achievements:{},   // id -> {date}
    certificates:[],   // {id, achId, date, code}
    missions:{ date:null, list:[] }, // list: [{id, done}]
    settings:{ theme:'dark', sound:true, animations:true }
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return Object.assign(defaultState(), parsed, {
      user: Object.assign(defaultState().user, parsed.user||{}),
      progress: Object.assign(defaultState().progress, parsed.progress||{}),
      monster: Object.assign(defaultState().monster, parsed.monster||{}),
      settings: Object.assign(defaultState().settings, parsed.settings||{}),
    });
  }catch(e){ console.error('Erro ao carregar dados', e); return defaultState(); }
}
function saveState(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

/* ---------------------------- HELPERS ---------------------------- */
const $ = (sel,root=document)=>root.querySelector(sel);
const $$ = (sel,root=document)=>Array.from(root.querySelectorAll(sel));
const todayStr = (d=new Date())=> d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fmtDate = (iso)=>{ const [y,m,d]=iso.split('-'); return `${d}/${m}`; };
const fmtDateFull = (iso)=>{ const [y,m,d]=iso.split('-'); return `${d}/${m}/${y}`; };
const fmtTime = (ts)=> new Date(ts).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function getClass(id){ return CLASSES.find(c=>c.id===id) || CLASSES[0]; }
function xpForLevel(level){ return Math.round(100 + (level-1)*45 + Math.pow(level,1.32)*4); }
function totalWaterMl(){ return state.logs.filter(l=>l.type==='water').reduce((s,l)=>s+l.amount,0); }
function todaysLogs(dateIso=todayStr()){ return state.logs.filter(l=> todayStr(new Date(l.ts))===dateIso ); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

function playSound(kind){
  if(!state.settings.sound) return;
  try{
    const ctx = playSound._ctx || (playSound._ctx = new (window.AudioContext||window.webkitAudioContext)());
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    const now = ctx.currentTime;
    let freqs = [520,780]; let dur=.12;
    if(kind==='hit'){ freqs=[220,140]; dur=.1; o.type='square'; }
    else if(kind==='xp'){ freqs=[660,880]; dur=.09; o.type='sine'; }
    else if(kind==='levelup'){ freqs=[440,660,880,1100]; dur=.11; o.type='triangle'; }
    else if(kind==='defeat'){ freqs=[300,500,700,1000]; dur=.1; o.type='sawtooth'; }
    else if(kind==='achievement'){ freqs=[500,700,900,1200]; dur=.1; o.type='sine'; }
    else { o.type='sine'; }
    g.gain.setValueAtTime(.001, now);
    freqs.forEach((f,i)=>{
      o.frequency.setValueAtTime(f, now+i*dur);
    });
    g.gain.exponentialRampToValueAtTime(.16, now+.02);
    g.gain.exponentialRampToValueAtTime(.001, now + freqs.length*dur + .05);
    o.start(now); o.stop(now + freqs.length*dur + .08);
  }catch(e){ /* audio not available */ }
}

function confetti(n=26){
  if(!state.settings.animations) return;
  const layer = $('#confetti-layer');
  const colors = ['#49E0D2','#E8C468','#F2895A','#9C8FE8','#6FCF7B'];
  for(let i=0;i<n;i++){
    const p = document.createElement('div');
    p.className='confetti-piece';
    const size = 6+Math.random()*6;
    p.style.width=size+'px'; p.style.height=(size*.4+4)+'px';
    p.style.left = Math.random()*100+'vw';
    p.style.background = colors[i%colors.length];
    p.style.animationDuration = (1.6+Math.random()*1.4)+'s';
    p.style.opacity = .9;
    layer.appendChild(p);
    setTimeout(()=>p.remove(), 3200);
  }
}

function toast(msg, ic='✨'){
  const stack = $('#toast-stack');
  const t = document.createElement('div');
  t.className='toast';
  t.innerHTML = `<span>${ic}</span><span>${msg}</span>`;
  stack.appendChild(t);
  setTimeout(()=>{ t.style.transition='opacity .3s'; t.style.opacity='0'; setTimeout(()=>t.remove(),320); }, 2600);
}

/* ---------------------------- TEMA ---------------------------- */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', state.settings.theme);
}

/* ---------------------------- MONSTRO ---------------------------- */
function currentRegion(){
  let region = REGIONS[0];
  for(const r of REGIONS){ if(state.progress.level >= r.minLevel) region = r; }
  return region;
}
function monsterHpMax(){
  const lvl = state.progress.level;
  return Math.round(80 + lvl*14 + state.progress.monstersDefeated*3);
}
function ensureMonster(){
  const region = currentRegion();
  if(!state.progress.regionsSeen.includes(region.id)){
    state.progress.regionsSeen.push(region.id);
  }
  if(state.monster.regionId !== region.id && REGIONS.findIndex(r=>r.id===region.id) > REGIONS.findIndex(r=>r.id===state.monster.regionId)){
    state.monster.regionId = region.id;
    state.monster.idx = 0;
    state.monster.hpMax = monsterHpMax();
    state.monster.hp = state.monster.hpMax;
  }
  if(!state.monster.hpMax || state.monster.hp==null){
    state.monster.hpMax = monsterHpMax();
    state.monster.hp = state.monster.hpMax;
  }
}
function currentMonster(){
  ensureMonster();
  const pool = MONSTERS_BY_REGION[state.monster.regionId] || MONSTERS_BY_REGION.vale;
  const m = pool[state.monster.idx % pool.length];
  return { name:m.n, emoji:m.e, region: REGIONS.find(r=>r.id===state.monster.regionId) };
}
function damageMonster(dmg){
  ensureMonster();
  state.monster.hp = clamp(state.monster.hp - dmg, 0, state.monster.hpMax);
  document.dispatchEvent(new CustomEvent('monster-hit'));
  if(state.monster.hp<=0){
    defeatMonster();
  }
}
function defeatMonster(){
  const m = currentMonster();
  state.progress.monstersDefeated++;
  const rewardXp = 40 + state.progress.level*4;
  const gained = addXp(rewardXp, false);
  state.monster.idx++;
  state.monster.hpMax = monsterHpMax();
  state.monster.hp = state.monster.hpMax;
  playSound('defeat');
  confetti(30);
  checkAchievements();
  saveState();
  openModal(defeatedModal(m, rewardXp));
}

/* ---------------------------- XP / NÍVEL ---------------------------- */
function addXp(amount, showLevelModal=true){
  const cls = getClass(state.user.classId);
  let mult = 1;
  state.progress.xp += Math.round(amount*mult);
  let leveledUp = false; let newLevel = state.progress.level;
  while(state.progress.xp >= xpForLevel(state.progress.level)){
    state.progress.xp -= xpForLevel(state.progress.level);
    state.progress.level++;
    leveledUp = true; newLevel = state.progress.level;
  }
  if(leveledUp){
    playSound('levelup');
    checkAchievements();
    if(showLevelModal){
      confetti(40);
      setTimeout(()=>openModal(levelUpModal(newLevel)), 350);
    }
  }
  return amount;
}

/* ---------------------------- STREAK ---------------------------- */
function registerActivityDate(){
  const today = todayStr();
  if(state.progress.lastActiveDate === today) return;
  if(!state.progress.joinDate) state.progress.joinDate = today;
  const last = state.progress.lastActiveDate;
  if(!last){
    state.progress.streak = 1;
  } else {
    const diffDays = Math.round((new Date(today) - new Date(last)) / 86400000);
    if(diffDays === 1){ state.progress.streak += 1; }
    else if(diffDays > 1){
      const guardianForgive = state.user.classId==='guardiao' && diffDays===2;
      state.progress.streak = guardianForgive ? Math.max(1,state.progress.streak-1) : 1;
    }
  }
  state.progress.lastActiveDate = today;
  if(state.progress.streak > state.progress.longestStreak) state.progress.longestStreak = state.progress.streak;
}

/* ---------------------------- MISSÕES DIÁRIAS ---------------------------- */
function seededPick(dateStr, pool, n){
  let seed = 0; for(const c of dateStr) seed = (seed*31 + c.charCodeAt(0))>>>0;
  const arr = pool.slice();
  const picked = [];
  for(let i=0;i<n && arr.length;i++){
    seed = (seed*1103515245 + 12345) >>> 0;
    const idx = seed % arr.length;
    picked.push(arr.splice(idx,1)[0]);
  }
  return picked;
}
function ensureMissions(){
  const today = todayStr();
  if(state.missions.date !== today){
    const picks = seededPick(today, MISSION_POOL, 4);
    state.missions = { date: today, list: picks.map(p=>({id:p.id, done:false})) };
  }
  const day = todaysLogs();
  state.missions.list.forEach(m=>{
    const def = MISSION_POOL.find(p=>p.id===m.id);
    if(def && !m.done && def.check(day)){
      m.done = true;
      const bonus = getClass(state.user.classId).id==='mago' ? Math.round(def.xp*1.1) : def.xp;
      addXp(bonus);
      toast(`Missão concluída: ${def.label} (+${bonus} XP)`, def.ic);
      playSound('xp');
    }
  });
}

/* ---------------------------- CONQUISTAS ---------------------------- */
function unlockAchievement(id){
  if(state.achievements[id]) return;
  const def = ACHIEVEMENTS.find(a=>a.id===id);
  if(!def) return;
  state.achievements[id] = { date: new Date().toISOString() };
  playSound('achievement');
  confetti(24);
  setTimeout(()=>openModal(achievementModal(def)), 300);
  if(CERT_MILESTONES.includes(id)){
    state.certificates.push({ id:uid(), achId:id, date:new Date().toISOString(), code:'HQ-'+uid().toUpperCase() });
  }
}
function checkAchievements(){
  const logs = state.logs;
  const waterLogs = logs.filter(l=>l.type==='water');
  if(waterLogs.length>=1) unlockAchievement('first_drop');
  if(logs.length>=5) unlockAchievement('journal5');
  if(waterLogs.length>=50) unlockAchievement('water_master');
  if(state.progress.streak>=3) unlockAchievement('streak_3');
  if(state.progress.streak>=7) unlockAchievement('streak_7');
  if(state.progress.streak>=30) unlockAchievement('streak_30');
  if(state.progress.streak>=100) unlockAchievement('streak_100');
  if(state.progress.regionsSeen.length>=3) unlockAchievement('explorer');
  if(state.progress.monstersDefeated>=10) unlockAchievement('slayer10');
  if(state.progress.monstersDefeated>=50) unlockAchievement('slayer50');
  if(state.progress.level>=10) unlockAchievement('level10');
  if(state.progress.level>=20) unlockAchievement('level20');
  if(state.progress.level>=35) unlockAchievement('level35');
  if(totalWaterMl()>=100000) unlockAchievement('liters100');
  const cats = new Set(logs.map(l=>l.cat).filter(Boolean));
  if(cats.size>=6) unlockAchievement('variety');
  const day = todaysLogs();
  const dayCats = new Set(day.map(l=>l.cat));
  if(dayCats.has('fruit') && dayCats.has('veg') && dayCats.has('protein')) unlockAchievement('colorful');
  const hasNight = logs.some(l=>{ const h=new Date(l.ts).getHours(); return h===0; });
  if(hasNight) unlockAchievement('night_owl');
  const hasEarly = logs.some(l=>{ const h=new Date(l.ts).getHours(); return h<6; });
  if(hasEarly) unlockAchievement('early_bird');
}

/* ---------------------------- REGISTRAR HÁBITO ---------------------------- */
function logSpamGuard(){
  const now = Date.now();
  const recent = state.logs.filter(l=> now-l.ts < 4000);
  return recent.length >= 3; // trava se 3+ registros em 4s (evita spam/XP infinito)
}
function submitWaterLog(amountMl){
  amountMl = Math.round(amountMl);
  if(amountMl<=0) return;
  if(amountMl>WATER_HARD_CAP){ toast('Esse valor parece muito alto para um único registro.', '⚠️'); return; }
  if(logSpamGuard()){ toast('Devagar, aventureiro! Aguarde alguns segundos.', '⏳'); return; }
  const cls = getClass(state.user.classId);
  let xp = Math.round(amountMl * WATER_XP_PER_ML);
  let dmg = xp;
  if(cls.id==='hidromante'){ xp = Math.round(xp*1.1); dmg = Math.round(dmg*1.15); }
  if(cls.id==='arqueiro'){ xp = Math.round(xp * (1 + Math.min(state.progress.streak,20)*0.005)); }
  const log = { id:uid(), type:'water', cat:'water', amount:amountMl, unit:'ml', ts:Date.now(), xp };
  state.logs.push(log);
  registerActivityDate();
  addXp(xp);
  damageMonster(dmg);
  ensureMissions();
  checkAchievements();
  saveState();
  playSound('xp');
  render();
  toast(`💧 +${amountMl} ml · +${xp} XP · ⚔️ ${dmg} de dano`, '💧');
}
function submitFoodLog(catId, portion){
  const cat = FOOD_CATEGORIES[catId];
  if(!cat) return;
  if(logSpamGuard()){ toast('Devagar, aventureiro! Aguarde alguns segundos.', '⏳'); return; }
  const cls = getClass(state.user.classId);
  let xp = cat.xp;
  if(cls.id==='guerreiro' && catId==='protein') xp = Math.round(xp*1.1);
  const log = { id:uid(), type:'food', cat:catId, amount:portion||1, unit:'porção', ts:Date.now(), xp };
  state.logs.push(log);
  registerActivityDate();
  addXp(xp);
  ensureMissions();
  checkAchievements();
  saveState();
  playSound('xp');
  render();
  const msg = catId==='soda' ? `🥤 Refrigerante registrado. +${xp} XP` : `${cat.emoji} ${cat.label} registrado. +${xp} XP${cat.bonus? ' · Bônus: '+cat.bonus:''}`;
  toast(msg, cat.emoji);
}
function deleteLog(id){
  state.logs = state.logs.filter(l=>l.id!==id);
  saveState(); render();
  toast('Registro excluído.', '🗑️');
}
function editLog(id, newAmount){
  const log = state.logs.find(l=>l.id===id);
  if(!log) return;
  if(log.type==='water'){
    const diff = newAmount - log.amount;
    log.amount = newAmount;
    log.xp = Math.round(newAmount * WATER_XP_PER_ML);
  } else {
    log.amount = newAmount;
  }
  saveState(); render();
  toast('Registro atualizado.', '✏️');
}

function afterRenderReports(){
  const canvas = $('#chart-water');
  if(!canvas) return;
  const today = new Date();
  const days = [...Array(7)].map((_,i)=>{ const d=new Date(today); d.setDate(d.getDate()-(6-i)); return d; });
  const values = days.map(d=> state.logs.filter(l=>l.type==='water' && todayStr(new Date(l.ts))===todayStr(d)).reduce((s,l)=>s+l.amount,0));
  drawBarChart(canvas, values, days.map(d=>['D','S','T','Q','Q','S','S'][d.getDay()]));
}
function drawBarChart(canvas, values, labels){
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width*dpr; canvas.height = 170*dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr,dpr);
  const w = rect.width, h = 170;
  ctx.clearRect(0,0,w,h);
  const max = Math.max(...values, 500);
  const barW = (w/values.length)*.5;
  const gap = (w/values.length);
  const styles = getComputedStyle(document.documentElement);
  ctx.font = '11px Nunito';
  values.forEach((v,i)=>{
    const bh = clamp((v/max)*118, v>0?4:0, 118);
    const x = gap*i + (gap-barW)/2;
    const y = h-30-bh;
    const grad = ctx.createLinearGradient(0,y,0,y+bh);
    grad.addColorStop(0,'#8FF0E4'); grad.addColorStop(1,'#2C8B84');
    ctx.fillStyle = grad;
    roundRect(ctx, x, y, barW, bh, 6); ctx.fill();
    ctx.fillStyle = styles.getPropertyValue('--text-faint').trim() || '#8AA2AA';
    ctx.textAlign='center';
    ctx.fillText(labels[i], x+barW/2, h-12);
  });
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function renderHistory(){
  let logs = state.logs.slice().sort((a,b)=>b.ts-a.ts);
  const now = new Date();
  if(ui.historyRange==='today') logs = logs.filter(l=>todayStr(new Date(l.ts))===todayStr());
  else if(ui.historyRange==='week') logs = logs.filter(l=> now-l.ts < 7*86400000);
  else if(ui.historyRange==='month') logs = logs.filter(l=> now-l.ts < 30*86400000);
  if(ui.historyFilter!=='all') logs = logs.filter(l=> ui.historyFilter==='water'? l.type==='water' : l.cat===ui.historyFilter);
  if(ui.historySearch) logs = logs.filter(l=> catLabel(l).toLowerCase().includes(ui.historySearch.toLowerCase()));

  const groups = {};
  logs.forEach(l=>{ const d=todayStr(new Date(l.ts)); (groups[d] = groups[d]||[]).push(l); });

  const filterCats = ['all','water','fruit','veg','protein','juice','soda','other'];
  return `
    <h2 class="font-display" style="font-size:20px; margin:4px 0 14px;">Histórico</h2>
    <input class="search-box" id="hist-search" placeholder="Buscar registros..." value="${ui.historySearch}">
    <div class="filter-row" id="hist-range">
      ${['today','week','month','all'].map(r=>`<button data-r="${r}" class="${ui.historyRange===r?'active':''}">${{today:'Hoje',week:'Semana',month:'Mês',all:'Tudo'}[r]}</button>`).join('')}
    </div>
    <div class="filter-row" id="hist-filter">
      ${filterCats.map(c=>`<button data-c="${c}" class="${ui.historyFilter===c?'active':''}">${c==='all'?'Todos':(c==='water'?'💧 Água':FOOD_CATEGORIES[c].emoji+' '+FOOD_CATEGORIES[c].label)}</button>`).join('')}
    </div>
    ${Object.keys(groups).length ? Object.entries(groups).map(([day,items])=>`
      <div class="hist-day">
        <h4>${day===todayStr()?'Hoje · ':''}${fmtDateFull(day)}</h4>
        ${items.map(l=>`
          <div class="hist-item" data-id="${l.id}">
            <div class="ic">${l.type==='water'?'💧':FOOD_CATEGORIES[l.cat]?.emoji||'🍽️'}</div>
            <div class="txt"><b>${catLabel(l)}${l.type==='water'?` — ${l.amount} ml`:''}</b><span>${fmtTime(l.ts)}</span></div>
            <div class="xp">+${l.xp} XP</div>
          </div>`).join('')}
      </div>
    `).join('') : `<div class="empty-state"><div class="ic">📭</div>Nenhum registro encontrado.</div>`}
  `;
}
function catLabel(l){ return l.type==='water' ? 'Água' : (FOOD_CATEGORIES[l.cat]?.label || 'Outro'); }

function bindModalEvents(){
  $('#modal-cancel')?.addEventListener('click', closeModal);
  $('#confirm-yes')?.addEventListener('click', ()=>{ window.__confirmAction && window.__confirmAction(); closeModal(); });

  // water modal
  let selectedWater = null;
  $$('#water-qty .qty-btn').forEach(b=>b.addEventListener('click', ()=>{
    $$('#water-qty .qty-btn').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected'); selectedWater = parseInt(b.dataset.v);
    $('#water-custom').value='';
  }));
  $('#water-custom')?.addEventListener('input', ()=>{ $$('#water-qty .qty-btn').forEach(x=>x.classList.remove('selected')); selectedWater=null; });
  $('#water-confirm')?.addEventListener('click', ()=>{
    const customVal = parseInt($('#water-custom').value);
    let amount = customVal>0 ? customVal : selectedWater;
    if(!amount){ toast('Escolha ou digite uma quantidade.', '💧'); return; }
    if(amount > WATER_MAX_SINGLE && amount<=WATER_HARD_CAP){
      openModal(confirmModal('Confirmar quantidade', `${amount} ml em um único registro é bastante. Deseja confirmar mesmo assim?`, ()=>{ submitWaterLog(amount); }));
      return;
    }
    submitWaterLog(amount);
    closeModal();
  });

  // food modal
  let selectedCat = null;
  $$('#food-cats .cat-btn').forEach(b=>b.addEventListener('click', ()=>{
    $$('#food-cats .cat-btn').forEach(x=>x.classList.remove('selected'));
    b.classList.add('selected'); selectedCat = b.dataset.id;
    $('#food-confirm').disabled=false;
  }));
  $('#food-confirm')?.addEventListener('click', ()=>{ if(selectedCat){ submitFoodLog(selectedCat,1); closeModal(); } });

  // edit profile
  $('#ep-photo-btn')?.addEventListener('click', ()=>$('#ep-photo-input').click());
  $('#ep-photo-input')?.addEventListener('change', (e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload=()=>{ $('#ep-photo-preview').innerHTML = `<img src="${reader.result}">`; window.__tempPhoto = reader.result; };
    reader.readAsDataURL(file);
  });
  $$('.class-card', document).forEach(btn=>{
    if(!btn.closest('.modal')) return;
    btn.addEventListener('click', ()=>{
      $$('.class-card').forEach(b=>b.classList.remove('selected'));
      btn.classList.add('selected'); window.__tempClass = btn.dataset.id;
    });
  });
  $('#ep-save')?.addEventListener('click', ()=>{
    const name = $('#ep-name').value.trim();
    if(name) state.user.name = name.slice(0,20);
    if(window.__tempPhoto) state.user.photo = window.__tempPhoto;
    if(window.__tempClass) state.user.classId = window.__tempClass;
    window.__tempPhoto=null; window.__tempClass=null;
    saveState(); render(); closeModal(); toast('Perfil atualizado.','✏️');
  });

  // notifications
  const stepBind=(idBase,delta,min,max,valId)=>{
    $(idBase)?.addEventListener('click', ()=>{ let v=parseInt($(valId).textContent)+delta; v=clamp(v,min,max); $(valId).textContent=v; });
  };
  stepBind('#nt-c-minus',-1,0,10,'#nt-c-val'); stepBind('#nt-c-plus',1,0,10,'#nt-c-val');
  stepBind('#nt-i-minus',-15,15,360,'#nt-i-val'); stepBind('#nt-i-plus',15,15,360,'#nt-i-val');
  $('#nt-save')?.addEventListener('click', ()=>{
    state.user.wake = $('#nt-wake').value||state.user.wake;
    state.user.sleep = $('#nt-sleep').value||state.user.sleep;
    state.user.reminderCount = parseInt($('#nt-c-val').textContent);
    state.user.reminderInterval = parseInt($('#nt-i-val').textContent);
    saveState(); render(); closeModal(); toast('Notificações atualizadas.','🔔');
    maybeSetupReminders(true);
  });

  // goal
  $('#gl-minus')?.addEventListener('click', ()=>{ let v=parseInt($('#gl-val').textContent)-100; v=clamp(v,500,6000); $('#gl-val').textContent=v; });
  $('#gl-plus')?.addEventListener('click', ()=>{ let v=parseInt($('#gl-val').textContent)+100; v=clamp(v,500,6000); $('#gl-val').textContent=v; });
  $('#gl-save')?.addEventListener('click', ()=>{
    state.user.hydrationGoal = parseInt($('#gl-val').textContent);
    saveState(); render(); closeModal(); toast('Meta atualizada.','🎯');
  });

  // edit/delete log
  $('#el-delete')?.addEventListener('click', ()=>{
    const title = 'Excluir registro'; const text='Tem certeza que deseja excluir este registro?';
    const idMatch = document.querySelector('.modal').innerHTML;
    openModal(confirmModal(title, text, ()=>{
      const logId = window.__editingLogId;
      deleteLog(logId);
    }, true));
  });
  const openLogId = ()=>{};
  $('#el-save')?.addEventListener('click', ()=>{
    const val = parseInt($('#el-amount').value);
    if(val>0 && val<=WATER_HARD_CAP){ editLog(window.__editingLogId, val); closeModal(); }
  });

  // certificate
  if($('#cert-canvas')){
    setTimeout(()=>{
      const canvas = $('#cert-canvas');
      const certId = document.currentCertificate;
      drawCertificate(canvas);
      $('#cert-download-png')?.addEventListener('click', ()=>{
        const a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download='hydraquest-certificado.png'; a.click();
      });
      $('#cert-download-pdf')?.addEventListener('click', ()=>{
        try{
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF({orientation:'landscape', unit:'px', format:[1000,650]});
          pdf.addImage(canvas.toDataURL('image/jpeg',0.95), 'JPEG', 0, 0, 1000, 650);
          pdf.save('hydraquest-certificado.pdf');
        }catch(e){ toast('Não foi possível gerar o PDF. Baixe a imagem.','⚠️'); }
      });
      $('#cert-share')?.addEventListener('click', async ()=>{
        canvas.toBlob(async (blob)=>{
          const file = new File([blob], 'certificado.png', {type:'image/png'});
          if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
            try{ await navigator.share({files:[file], title:'Meu certificado HydraQuest'}); }catch(e){}
          } else {
            const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='hydraquest-certificado.png'; a.click();
            toast('Compartilhamento não suportado — imagem baixada.', '📤');
          }
        });
      });
    }, 30);
  }

  // feedback
  let fbStars = 0;
  $$('#fb-stars span').forEach(s=>s.addEventListener('click', ()=>{
    fbStars = parseInt(s.dataset.n);
    $$('#fb-stars span').forEach(x=>x.style.opacity = parseInt(x.dataset.n)<=fbStars?'1':'.35');
  }));
  $('#fb-send')?.addEventListener('click', ()=>{
    closeModal(); toast('Obrigado pelo seu feedback!','⭐');
  });
}

// track editing log id whenever edit modal opened
const _origEditLogModal = editLogModal;
editLogModal = function(log){ window.__editingLogId = log?log.id:null; return _origEditLogModal(log); };
const _origCertModal = certificateModal;

/* ---------------------------- CERTIFICADO (canvas) ---------------------------- */
function drawCertificate(canvas){
  const cert = document.currentCertificate;
  const a = ACHIEVEMENTS.find(x=>x.id===cert.achId);
  const cls = getClass(state.user.classId);
  const ctx = canvas.getContext('2d');
  const W=1000,H=650;
  // background
  const bg = ctx.createLinearGradient(0,0,W,H);
  bg.addColorStop(0,'#0B1826'); bg.addColorStop(1,'#132C42');
  ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  // decorative rings
  ctx.strokeStyle='rgba(73,224,210,.18)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(120,120,90,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(880,530,110,0,Math.PI*2); ctx.stroke();
  // frame
  ctx.strokeStyle='#E8C468'; ctx.lineWidth=4;
  ctx.strokeRect(28,28,W-56,H-56);
  ctx.strokeStyle='rgba(232,196,104,.4)'; ctx.lineWidth=1;
  ctx.strokeRect(40,40,W-80,H-80);
  // title
  ctx.textAlign='center';
  ctx.fillStyle='#E8C468';
  ctx.font='700 20px Georgia';
  ctx.fillText('C E R T I F I C A D O   D E   C O N Q U I S T A', W/2, 110);
  ctx.font='34px Georgia';
  ctx.fillStyle='#EAF4F4';
  ctx.fillText(a? a.name : 'Conquista', W/2, 165);
  // icon
  ctx.font='90px serif';
  ctx.fillText(a?a.ic:'🏆', W/2, 300);
  // body
  ctx.font='16px Georgia'; ctx.fillStyle='#9FB8C4';
  ctx.fillText('Este certificado é concedido a', W/2, 350);
  ctx.font='700 40px Georgia'; ctx.fillStyle='#49E0D2';
  ctx.fillText(state.user.name||'Aventureiro', W/2, 400);
  ctx.font='16px Georgia'; ctx.fillStyle='#9FB8C4';
  ctx.fillText(`${cls.name} · Nível ${state.progress.level} · ${a?a.desc:''}`, W/2, 430);
  ctx.font='14px Georgia'; ctx.fillStyle='#6C8494';
  ctx.fillText(`Concedido em ${new Date(cert.date).toLocaleDateString('pt-BR')}`, W/2, 465);
  // footer
  ctx.textAlign='left';
  ctx.font='700 18px Georgia'; ctx.fillStyle='#E8C468';
  ctx.fillText('💧 HydraQuest', 70, 590);
  ctx.textAlign='right';
  ctx.font='12px monospace'; ctx.fillStyle='#6C8494';
  ctx.fillText('ID: '+cert.code, W-70, 590);
}

/* ---------------------------- LEMBRETES (Notification API) ---------------------------- */
let reminderTimer = null;
function maybeSetupReminders(forceAsk){
  if(reminderTimer){ clearInterval(reminderTimer); reminderTimer=null; }
  if(state.user.reminderCount<=0) return;
  if(!('Notification' in window)) return;
  const setup = ()=>{
    const intervalMs = state.user.reminderInterval*60*1000;
    reminderTimer = setInterval(()=>{
      if(Notification.permission==='granted' && document.visibilityState!=='visible'){
        try{ new Notification('💧 Hora de continuar sua aventura!', {body:'Você quer registrar uma bebida ou alimento?', icon:'', tag:'hydraquest'}); }catch(e){}
      }
    }, Math.max(intervalMs, 5*60*1000));
  };
  if(Notification.permission==='granted') setup();
  else if(Notification.permission!=='denied' && forceAsk){
    toast('Ative as notificações do navegador para receber lembretes.', '🔔');
  }
}

/* ---------------------------- utils ---------------------------- */
function escapeHtml(str){
  return String(str||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

applyTheme();
startSplashFlow();
</script>
